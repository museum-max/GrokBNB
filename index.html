
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Worldcore (WCORE) Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>
  <style>
    body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); }
    .card { background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(10px); }
  </style>
</head>
<body class="min-h-screen text-white p-4 md:p-8">
  <div class="max-w-5xl mx-auto">
    <!-- Header -->
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8">
      <div>
        <h1 class="text-3xl font-bold text-amber-400">Worldcore (WCORE)</h1>
        <p class="text-slate-400 text-sm">BNB Launch Dashboard</p>
      </div>
      <div class="flex gap-3">
        <input id="contractAddress" type="text" placeholder="Paste contract address"
               class="bg-slate-800 border border-slate-600 rounded-lg px-4 py-2 w-72 text-sm focus:outline-none focus:border-amber-500" />
        <button onclick="connectWallet()" id="connectBtn"
                class="bg-amber-500 hover:bg-amber-600 text-black font-semibold px-5 py-2 rounded-lg transition">
          Connect Wallet
        </button>
      </div>
    </div>

    <!-- Status -->
    <div id="status" class="mb-6 text-sm text-slate-400"></div>

    <!-- Main Grid -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      
      <!-- Token Info -->
      <div class="card rounded-2xl p-6 border border-slate-700">
        <h2 class="text-lg font-semibold mb-4 text-amber-400">Token Info</h2>
        <div class="space-y-3 text-sm">
          <div class="flex justify-between"><span class="text-slate-400">Name</span><span id="tokenName">-</span></div>
          <div class="flex justify-between"><span class="text-slate-400">Symbol</span><span id="tokenSymbol">-</span></div>
          <div class="flex justify-between"><span class="text-slate-400">Total Supply</span><span id="totalSupply">-</span></div>
          <div class="flex justify-between"><span class="text-slate-400">Your Balance</span><span id="userBalance" class="font-bold text-green-400">-</span></div>
          <div class="flex justify-between"><span class="text-slate-400">Trading</span><span id="tradingStatus">-</span></div>
          <div class="flex justify-between"><span class="text-slate-400">Paused</span><span id="pausedStatus">-</span></div>
        </div>
      </div>

      <!-- Taxes & Limits -->
      <div class="card rounded-2xl p-6 border border-slate-700">
        <h2 class="text-lg font-semibold mb-4 text-amber-400">Taxes & Limits</h2>
        <div class="space-y-3 text-sm">
          <div class="flex justify-between"><span class="text-slate-400">Buy Tax</span><span id="buyTax">-</span></div>
          <div class="flex justify-between"><span class="text-slate-400">Sell Tax</span><span id="sellTax">-</span></div>
          <div class="flex justify-between"><span class="text-slate-400">Transfer Tax</span><span id="transferTax">-</span></div>
          <div class="flex justify-between"><span class="text-slate-400">Max Buy</span><span id="maxBuy">-</span></div>
          <div class="flex justify-between"><span class="text-slate-400">Max Sell</span><span id="maxSell">-</span></div>
          <div class="flex justify-between"><span class="text-slate-400">Max Wallet</span><span id="maxWallet">-</span></div>
        </div>
      </div>

      <!-- Transfer -->
      <div class="card rounded-2xl p-6 border border-slate-700">
        <h2 class="text-lg font-semibold mb-4 text-amber-400">Transfer</h2>
        <div class="space-y-3">
          <input id="transferTo" type="text" placeholder="Recipient address"
                 class="w-full bg-slate-800 border border-slate-600 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-amber-500" />
          <input id="transferAmount" type="number" placeholder="Amount"
                 class="w-full bg-slate-800 border border-slate-600 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-amber-500" />
          <button onclick="transferTokens()"
                  class="w-full bg-green-600 hover:bg-green-700 text-white font-medium py-2 rounded-lg transition">
            Send Tokens
          </button>
        </div>
      </div>
    </div>

    <!-- Vesting Section -->
    <div class="card rounded-2xl p-6 border border-slate-700 mt-6">
      <h2 class="text-lg font-semibold mb-4 text-amber-400">Team Vesting</h2>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
        <div>
          <label class="text-sm text-slate-400">Beneficiary Address</label>
          <input id="vestingAddress" type="text" placeholder="0x..."
                 class="w-full bg-slate-800 border border-slate-600 rounded-lg px-3 py-2 text-sm mt-1 focus:outline-none focus:border-amber-500" />
        </div>
        <div>
          <label class="text-sm text-slate-400">Vested Amount</label>
          <div id="vestedAmount" class="bg-slate-800 border border-slate-600 rounded-lg px-3 py-2 text-sm mt-1">-</div>
        </div>
        <button onclick="checkVesting()" class="bg-slate-600 hover:bg-slate-500 py-2 rounded-lg text-sm">Check Vesting</button>
        <button onclick="releaseVesting()" class="bg-amber-600 hover:bg-amber-700 py-2 rounded-lg text-sm md:col-span-3">
          Release Vesting
        </button>
      </div>
    </div>

    <!-- Owner Panel -->
    <div id="ownerPanel" class="card rounded-2xl p-6 border border-amber-700/50 mt-6 hidden">
      <h2 class="text-lg font-semibold mb-4 text-amber-400">Owner Panel</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-3">
        <button onclick="enableTrading()" class="bg-green-700 hover:bg-green-600 py-2 rounded-lg text-sm">Enable Trading</button>
        <button onclick="pauseToken()" class="bg-red-700 hover:bg-red-600 py-2 rounded-lg text-sm">Pause</button>
        <button onclick="unpauseToken()" class="bg-green-700 hover:bg-green-600 py-2 rounded-lg text-sm">Unpause</button>
        <button onclick="setTaxesPrompt()" class="bg-blue-700 hover:bg-blue-600 py-2 rounded-lg text-sm">Set Taxes</button>
      </div>
    </div>

    <!-- Footer -->
    <p class="text-center text-slate-500 text-xs mt-10">
      Connected: <span id="walletAddress">Not connected</span>
    </p>
  </div>

  <script>
    // ========== CONFIG ==========
    const BSC_CHAIN_ID = 56n; // Mainnet. Use 97n for Testnet
    let provider, signer, contract, userAddress;

    // Minimal ABI (only what we need)
    const ABI = [
      "function name() view returns (string)",
      "function symbol() view returns (string)",
      "function totalSupply() view returns (uint256)",
      "function balanceOf(address) view returns (uint256)",
      "function decimals() view returns (uint8)",
      "function transfer(address to, uint256 amount) returns (bool)",
      "function paused() view returns (bool)",
      "function tradingEnabled() view returns (bool)",
      "function buyTax() view returns (uint256)",
      "function sellTax() view returns (uint256)",
      "function transferTax() view returns (uint256)",
      "function maxBuyAmount() view returns (uint256)",
      "function maxSellAmount() view returns (uint256)",
      "function maxWalletAmount() view returns (uint256)",
      "function owner() view returns (address)",
      "function enableTrading()",
      "function pause()",
      "function unpause()",
      "function setTaxes(uint256,uint256,uint256)",
      "function vestedAmount(address) view returns (uint256)",
      "function releaseTeamVesting(address)",
      "function vestingSchedules(address) view returns (uint256 totalAmount, uint256 released, uint256 start, uint256 cliff, uint256 duration, uint256 interval, bool active)"
    ];

    // ========== CONNECT ==========
    async function connectWallet() {
      if (!window.ethereum) {
        alert("Please install MetaMask!");
        return;
      }

      try {
        provider = new ethers.BrowserProvider(window.ethereum);
        await provider.send("eth_requestAccounts", []);
        signer = await provider.getSigner();
        userAddress = await signer.getAddress();

        const network = await provider.getNetwork();
        if (network.chainId !== BSC_CHAIN_ID) {
          try {
            await window.ethereum.request({
              method: "wallet_switchEthereumChain",
              params: [{ chainId: "0x38" }] // BSC Mainnet
            });
          } catch (e) {
            alert("Please switch to BNB Smart Chain");
            return;
          }
        }

        document.getElementById("connectBtn").textContent = "Connected";
        document.getElementById("walletAddress").textContent = userAddress.slice(0, 6) + "..." + userAddress.slice(-4);
        document.getElementById("status").textContent = "Wallet connected successfully";

        const addr = document.getElementById("contractAddress").value.trim();
        if (addr) await loadContract(addr);
      } catch (err) {
        console.error(err);
        alert("Connection failed: " + err.message);
      }
    }

    async function loadContract(address) {
      contract = new ethers.Contract(address, ABI, signer);
      await refreshData();
    }

    // ========== DATA ==========
    async function refreshData() {
      if (!contract) return;

      try {
        const [
          name, symbol, totalSupply, balance, decimals,
          paused, trading, buyTax, sellTax, transferTax,
          maxBuy, maxSell, maxWallet, owner
        ] = await Promise.all([
          contract.name(),
          contract.symbol(),
          contract.totalSupply(),
          contract.balanceOf(userAddress),
          contract.decimals(),
          contract.paused(),
          contract.tradingEnabled(),
          contract.buyTax(),
          contract.sellTax(),
          contract.transferTax(),
          contract.maxBuyAmount(),
          contract.maxSellAmount(),
          contract.maxWalletAmount(),
          contract.owner()
        ]);

        const fmt = (v) => Number(ethers.formatUnits(v, decimals)).toLocaleString();

        document.getElementById("tokenName").textContent = name;
        document.getElementById("tokenSymbol").textContent = symbol;
        document.getElementById("totalSupply").textContent = fmt(totalSupply);
        document.getElementById("userBalance").textContent = fmt(balance) + " " + symbol;
        document.getElementById("tradingStatus").textContent = trading ? "✅ Enabled" : "❌ Disabled";
        document.getElementById("pausedStatus").textContent = paused ? "⏸ Paused" : "▶️ Active";
        document.getElementById("buyTax").textContent = buyTax + "%";
        document.getElementById("sellTax").textContent = sellTax + "%";
        document.getElementById("transferTax").textContent = transferTax + "%";
        document.getElementById("maxBuy").textContent = fmt(maxBuy);
        document.getElementById("maxSell").textContent = fmt(maxSell);
        document.getElementById("maxWallet").textContent = fmt(maxWallet);

        // Show owner panel
        if (owner.toLowerCase() === userAddress.toLowerCase()) {
          document.getElementById("ownerPanel").classList.remove("hidden");
        }
      } catch (err) {
        console.error(err);
        document.getElementById("status").textContent = "Error loading contract: " + err.message;
      }
    }

    // ========== ACTIONS ==========
    async function transferTokens() {
      const to = document.getElementById("transferTo").value.trim();
      const amount = document.getElementById("transferAmount").value;
      if (!to || !amount) return alert("Fill both fields");

      try {
        const decimals = await contract.decimals();
        const tx = await contract.transfer(to, ethers.parseUnits(amount, decimals));
        document.getElementById("status").textContent = "Transaction sent... waiting confirmation";
        await tx.wait();
        document.getElementById("status").textContent = "✅ Transfer successful!";
        await refreshData();
      } catch (err) {
        alert("Transfer failed: " + err.message);
      }
    }

    async function checkVesting() {
      const addr = document.getElementById("vestingAddress").value.trim() || userAddress;
      try {
        const amount = await contract.vestedAmount(addr);
        const decimals = await contract.decimals();
        document.getElementById("vestedAmount").textContent = 
          Number(ethers.formatUnits(amount, decimals)).toLocaleString() + " tokens";
      } catch (err) {
        alert("Error: " + err.message);
      }
    }

    async function releaseVesting() {
      const addr = document.getElementById("vestingAddress").value.trim() || userAddress;
      try {
        const tx = await contract.releaseTeamVesting(addr);
        document.getElementById("status").textContent = "Releasing vesting...";
        await tx.wait();
        document.getElementById("status").textContent = "✅ Vesting released!";
        await checkVesting();
      } catch (err) {
        alert("Release failed: " + err.message);
      }
    }

    async function enableTrading() {
      try {
        const tx = await contract.enableTrading();
        await tx.wait();
        alert("Trading enabled!");
        await refreshData();
      } catch (err) { alert(err.message); }
    }

    async function pauseToken() {
      try {
        const tx = await contract.pause();
        await tx.wait();
        await refreshData();
      } catch (err) { alert(err.message); }
    }

    async function unpauseToken() {
      try {
        const tx = await contract.unpause();
        await tx.wait();
        await refreshData();
      } catch (err) { alert(err.message); }
    }

    async function setTaxesPrompt() {
      const buy = prompt("Buy tax % (0-25)", "5");
      const sell = prompt("Sell tax % (0-25)", "8");
      const transfer = prompt("Transfer tax % (0-25)", "0");
      if (buy === null) return;
      try {
        const tx = await contract.setTaxes(buy, sell, transfer);
        await tx.wait();
        await refreshData();
      } catch (err) { alert(err.message); }
    }

    // Auto-load if address is already filled
    document.getElementById("contractAddress").addEventListener("change", async (e) => {
      if (signer && e.target.value) await loadContract(e.target.value.trim());
    });
  </script>
</body>
</html>
